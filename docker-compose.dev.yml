# Entorno de DESARROLLO local para probar asset-inventory-service (p. ej. vía Postman).
# NO es producción (contraseñas triviales, Keycloak en start-dev). Ver deploy/README.md.
#
#   docker compose -f docker-compose.dev.yml up --build
#
name: redsegura-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asset_inventory
      POSTGRES_USER: redsegura
      POSTGRES_PASSWORD: changeme
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redsegura -d asset_inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/redsegura-realm.json:/opt/keycloak/data/import/redsegura-realm.json:ro
    ports: ["8080:8080"]

  asset-inventory:
    build:
      context: .
      dockerfile: asset-inventory-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/asset_inventory
      DB_USER: redsegura
      DB_PASSWORD: changeme
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/redsegura/protocol/openid-connect/certs
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_started }
