version: 2
updates:
  # --- Maven (POM padre + servicios Java) ---
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Agrupar minor/patch en un solo PR; los majors salen individuales.
      maven-minor-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # --- pip (servicios Python) ---
  # Se añade una entrada por cada servicio Python cuando se scaffoldee, apuntando a su
  # directorio (donde viva requirements.txt / pyproject.toml). Ejemplo:
  # - package-ecosystem: "pip"
  #   directory: "/config-backup-service"
  #   schedule:
  #     interval: "weekly"
  #   groups:
  #     pip-minor-patch:
  #       update-types: ["minor", "patch"]
