# Gate de release. Al liberar a `main`, "done = production-ready" exige:
#  1) que ningún microservicio tenga casos de prueba en ⏳ PENDIENTE (DoD #1, L-QA-08);
#  2) que todo vector de interacción entre servicios ya construidos tenga golden path ejecutado
#     (RNF-32, L-QA-09).
# Durante el desarrollo en ramas y en `develop` los ⏳ y los golden paths en curso son legítimos, por
# eso este gate solo se exige en los PR hacia `main`.
name: QA release gate (casos + integración cross-service)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casos-completos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar 0 casos en ⏳ PENDIENTE (todos los servicios)
        run: python scripts/check_casos_completos.py --all

      - name: Verificar golden path por vector de interacción (RNF-32)
        run: python scripts/check_golden_paths.py
