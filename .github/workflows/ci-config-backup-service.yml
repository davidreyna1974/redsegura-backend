# Gatekeeper de CI de config-backup-service (Python/FastAPI). Se activa por ruta: solo corre cuando
# cambia el código del servicio. Ejecuta el mismo gate que en local (lint + tipos + tests + cobertura).
name: CI · config-backup-service

on:
  push:
    branches: [develop, main]
    paths:
      - "config-backup-service/**"
      - ".github/workflows/ci-config-backup-service.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "config-backup-service/**"
      - ".github/workflows/ci-config-backup-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-config-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-backup-service
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config-backup-service/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy app tests

      - name: Tests + cobertura (>= 70%)
        run: pytest tests --cov=app --cov-fail-under=70
