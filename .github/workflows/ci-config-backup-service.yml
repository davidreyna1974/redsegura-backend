# Gatekeeper de CI de config-backup-service (Python/FastAPI). Se activa por ruta: solo corre cuando
# cambia el código del servicio. Ejecuta el mismo gate que en local (lint + tipos + tests + cobertura).
name: CI · config-backup-service

on:
  push:
    branches: [develop, main]
    paths:
      - "config-backup-service/**"
      - ".github/workflows/ci-config-backup-service.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "config-backup-service/**"
      - ".github/workflows/ci-config-backup-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-config-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-backup-service
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config-backup-service/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy app tests

      - name: Tests + cobertura (>= 70%)
        run: pytest tests --cov=app --cov-fail-under=70

      # Cadena de suministro (RNF-08/ADR-16). pip-audit informa advisories de las dependencias
      # Python (no bloqueante: cubre no-críticos); el bloqueo en CRÍTICO lo hace Trivy sobre la imagen.
      - name: SCA de dependencias Python (pip-audit — informativo)
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --desc

      - name: Instalar Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      # La imagen incluye el venv con las deps de runtime + el SO base → Trivy cubre SCA + imagen.
      - name: Construir imagen del servicio
        working-directory: ${{ github.workspace }}
        run: docker build -f config-backup-service/Dockerfile -t config-backup-service:ci .

      - name: Escaneo de cadena de suministro (Trivy image — deps + imagen, bloqueante en CRÍTICO)
        run: trivy image --scanners vuln --severity CRITICAL --exit-code 1 --ignore-unfixed config-backup-service:ci
