# Gatekeeper de CI de asset-inventory-service. Se activa por ruta: solo corre cuando cambia el
# código del servicio o la configuración de build/calidad compartida. Ejecuta el mismo gatekeeper
# que en local (build + tests con Testcontainers + cobertura >= 70% + lint/formato).
name: CI · asset-inventory-service

on:
  push:
    branches: [develop, main]
    paths:
      - "asset-inventory-service/**"
      - "pom.xml"
      - "checkstyle-suppressions.xml"
      - ".github/workflows/ci-asset-inventory-service.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "asset-inventory-service/**"
      - "pom.xml"
      - "checkstyle-suppressions.xml"
      - ".github/workflows/ci-asset-inventory-service.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancela runs anteriores del mismo ref si llega uno nuevo (ahorra minutos de runner).
concurrency:
  group: ci-asset-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-java genera ~/.m2/toolchains.xml con el JDK 21 instalado, que satisface el
      # maven-toolchains-plugin del POM padre (build reproducible en el JDK objetivo).
      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Gatekeeper único: build + tests (Testcontainers gestiona PostgreSQL/RabbitMQ con el Docker
      # del runner) + cobertura (jacoco:check, umbral 70%) + lint/formato (spotless + checkstyle).
      # Todo está ligado a la fase `verify` en el POM padre.
      - name: Gatekeeper (build + tests + cobertura + lint)
        run: mvn -pl asset-inventory-service -am -B clean verify

      # Cadena de suministro (RNF-08/ADR-16), bloqueante en severidad CRÍTICA. Se usa el CLI de Trivy
      # (instalador oficial) en vez de la action, más robusto ante cambios de sus dependencias internas.
      - name: Instalar Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      # Construir la imagen real del servicio (artefacto que se desplegaría).
      - name: Construir imagen del servicio
        run: docker build -f asset-inventory-service/Dockerfile -t asset-inventory-service:ci .

      # Escaneo de la IMAGEN: Trivy inspecciona tanto las capas del SO como las LIBRERÍAS Java
      # empaquetadas dentro del jar → cubre SCA de dependencias + imagen en un paso, sin resolver
      # POMs remotos (evita el rate-limit de Maven Central). Bloqueante en crítico.
      - name: Escaneo de cadena de suministro (Trivy image — deps + imagen)
        run: trivy image --scanners vuln --severity CRITICAL --exit-code 1 --ignore-unfixed asset-inventory-service:ci
