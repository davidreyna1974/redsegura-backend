spring:
  application:
    name: asset-inventory-service

  # Configuración por entorno (12-factor). En tests, Testcontainers la sobrescribe.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asset_inventory}
    username: ${DB_USER:redsegura}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que el mapeo coincida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  # Message broker (RabbitMQ) para publicar eventos asset.* vía outbox (RN11).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # OAuth2 Resource Server (RNF-03): valida el JWT de Keycloak. El decoder es perezoso (no
  # descarga los JWKs al arrancar), por eso no requiere Keycloak vivo en los tests.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/redsegura/protocol/openid-connect/certs}

server:
  port: 8081

# Transactional outbox (RN11/ADR-04): el relay publica los eventos pendientes periódicamente.
redsegura:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:2000}

# Observabilidad (RNF-15..17). Los probes del contrato viven en /api/v1/health/*;
# Actuator expone health + métricas Prometheus. El traceId/spanId (Micrometer Tracing) se
# propaga e inyecta en los logs JSON; el exportador OTLP a Jaeger se activa por entorno.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 1.0 en desarrollo (todas las peticiones). Bajar por entorno en producción de alto volumen.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
