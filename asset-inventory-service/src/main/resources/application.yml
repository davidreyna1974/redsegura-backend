spring:
  application:
    name: asset-inventory-service

  # Apagado ordenado (graceful shutdown): ante SIGTERM (p. ej. rolling deploy de k8s), el servidor
  # deja de aceptar conexiones nuevas y drena las peticiones en vuelo antes de terminar. El executor
  # del bulk (@Async) también espera a completar sus tareas (ver AsyncConfig).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Configuración por entorno (12-factor). En tests, Testcontainers la sobrescribe.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asset_inventory}
    username: ${DB_USER:redsegura}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que el mapeo coincida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true

  # Message broker (RabbitMQ) para publicar eventos asset.* vía outbox (RN11).
  # publisher-confirm-type=correlated (RNF-30/ADR-15): el relay espera el ACK del broker antes de
  # marcar un evento como publicado; sin confirm, la transacción revierte y el evento se reintenta.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated

  # OAuth2 Resource Server (RNF-03): valida el JWT de Keycloak. El decoder es perezoso (no
  # descarga los JWKs al arrancar), por eso no requiere Keycloak vivo en los tests.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/redsegura/protocol/openid-connect/certs}

server:
  port: 8081
  shutdown: graceful

# OpenAPI navegable en runtime (RNF-27/ADR-17). Swagger UI carga el contrato openapi.yaml (fuente de
# verdad contract-first) servido como recurso estatico en /openapi.yaml. Doc sin autenticacion.
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html

# Validación de JWT en profundidad (RNF-29/ADR-14): además de firma y expiración, el decoder valida
# el issuer (emisor) y la audience (aud/azp) esperados. issuer = URL del realm tal como aparece en el
# claim `iss` del token (la que usa el cliente para pedirlo); audience = identificador del backend
# (mapper de audiencia en Keycloak). Un token de otro realm/audiencia → 401.
redsegura:
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/redsegura}
    audience: ${KEYCLOAK_AUDIENCE:redsegura-backend}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:2000}
  # Retención de datos operativos: purga programada de filas que solo harían crecer las tablas sin
  # límite (outbox ya publicado, claves de idempotencia, jobs de importación). Ventanas en días.
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 30 3 * * *}
    outbox-published-days: ${RETENTION_OUTBOX_DAYS:7}
    idempotency-days: ${RETENTION_IDEMPOTENCY_DAYS:2}
    import-jobs-days: ${RETENTION_IMPORT_JOBS_DAYS:30}

# Observabilidad (RNF-15..17). Los probes del contrato viven en /api/v1/health/*;
# Actuator expone health + métricas Prometheus. El traceId/spanId (Micrometer Tracing) se
# propaga e inyecta en los logs JSON; el exportador OTLP a Jaeger se activa por entorno.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      # 1.0 en desarrollo (todas las peticiones). Bajar por entorno en producción de alto volumen.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
