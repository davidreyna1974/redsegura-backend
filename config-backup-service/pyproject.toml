[project]
name = "config-backup-service"
version = "0.1.0"
description = "Respaldo y versionado de configuraciones de red (RF-06..10)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn>=0.32,<1.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pika>=1.3,<2.0",
    "jsonschema>=4.23,<5.0",
    "GitPython>=3.1,<4.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "netmiko>=4.4,<5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "testcontainers>=4.8,<5.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "types-jsonschema>=4.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
# Las migraciones Alembic tienen su propio formato generado; no se lintan.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# Reglas: errores (E,F), imports (I), bugbear (B), pyupgrade (UP), naming (N), comprehensions (C4).
select = ["E", "F", "I", "B", "UP", "N", "C4", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pika.*", "alembic.*", "git.*", "netmiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
